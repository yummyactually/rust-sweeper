[package]
name = "minesweeper_rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "A classic native Minesweeper game with a Win32/GDI interface, written in Rust."
license = "MIT"

[lib]
name = "minesweeper_rust"
path = "src/lib.rs"

[[bin]]
name = "minesweeper"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"